# =====================================================================
# 项目元数据（标准声明）
# 说明：
#   - 依赖安装仍以 requirements.txt 为准（Streamlit Cloud 部署入口）
#   - 本文件仅作为标准化元数据 + 工具配置，不用于 pip install -e .
# =====================================================================
[project]
name = "football-prediction"
version = "1.4.0"
description = "足球赛事预测系统（三模型融合 + Streamlit 看板 + WF 金标准验证）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["football", "prediction", "lightgbm", "poisson", "streamlit"]
dependencies = [
    "streamlit>=1.29,<2.0",
    "pandas>=2.0,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.10,<2.0",
    "lightgbm>=4.0,<5.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3,<2.0",
    "plotly>=5.0,<6.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
# 开发/测试依赖（python -m pytest tests/ -v）
dev = [
    "pytest>=8.0,<9.0",
]

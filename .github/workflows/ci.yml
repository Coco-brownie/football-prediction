# =====================================================================
# CI 工作流：push / PR 自动跑回归测试 + 数据库完整性验证
# 触发：push 到 main、PR 到 main、手动运行（Actions 页 Run workflow）
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 允许手动触发

jobs:
  test:
    name: 回归测试 + 数据库验证
    runs-on: ubuntu-latest
    timeout-minutes: 20     # 防止依赖下载卡死

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'      # 依赖缓存，加速后续运行

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 回归测试（tests/）
        run: python -m pytest tests/ -v

      - name: 数据库完整性验证
        run: python verify_db.py
